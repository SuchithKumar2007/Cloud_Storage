name: Build MEMOPIX Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35 and build tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci --prefer-offline || npm install

      - name: Build Web Application
        working-directory: ./frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: ./frontend
        run: npx cap sync android

      - name: Grant gradlew execute permission
        working-directory: ./frontend/android
        run: chmod +x gradlew

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk build-output/MEMOPIX-Android-v1.0.0.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEMOPIX-Android-APK
          path: build-output/MEMOPIX-Android-v1.0.0.apk
          retention-days: 90

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "MEMOPIX Android APK - Latest Build"
          body: |
            ## 📱 MEMOPIX Android APK

            Install this APK on **any Android phone** to get the full MEMOPIX 5 TB private cloud experience.

            ### How to Install:
            1. Download `MEMOPIX-Android-v1.0.0.apk` below
            2. On your Android phone → Settings → Security → **Allow unknown sources**
            3. Tap the downloaded APK file → **Install**
            4. Open MEMOPIX from your app drawer!

            ### First Launch Setup:
            - Tap **Server Settings** (gear icon) on the login screen
            - Enter your PC IP address: `http://192.168.29.61:5000`
            - Or paste your Cloudflare tunnel URL for worldwide access

            Built automatically from the `main` branch.
          files: build-output/MEMOPIX-Android-v1.0.0.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
